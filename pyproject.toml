[project]
name = "understand-language-models-project"
version = "0.1.0"
description = "Research tooling for persona-vector steering of Hugging Face language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.2",
    "tokenizers>=0.15",
    "tqdm>=4.66",
    "transformers>=4.51,<5",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.45"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
steering-fetch = "steering.cli.fetch_vectors:main"
steering-clean-model = "steering.cli.clean_model_cache:main"
steering-experiment = "steering.cli.experiment:main"
steering-j-lens = "steering.cli.j_lens_tokens:main"
steering-preflight = "steering.cli.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steering"]

[tool.hatch.build.targets.wheel.force-include]
"src/steering/web/experiment.html" = "steering/web/experiment.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that download a tiny Hugging Face model",
    "gpu: opt-in large-model GPU smoke tests",
]
