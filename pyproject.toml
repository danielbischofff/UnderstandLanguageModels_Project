[project]
name = "understand-language-models-project"
version = "0.1.0"
description = "Research tooling for persona-vector steering of Hugging Face language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "huggingface-hub>=0.30",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.2",
    "tqdm>=4.66",
    "transformers>=4.51,<5",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.45"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
steering-fetch = "steering.cli.fetch_vectors:main"
steering-calibrate = "steering.cli.calibrate:main"
steering-generate = "steering.cli.steer_generate:main"
steering-sweep = "steering.cli.sweep:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that download a tiny Hugging Face model",
    "gpu: opt-in large-model GPU smoke tests",
]
