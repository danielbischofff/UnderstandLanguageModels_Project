# 12 questions x 16 personas x 2 band widths x 4 schemes + 12 controls = 1548 trials.
# Replaces the planned full alpha/band comparison; original configurations are retained for provenance.
# First question per topic, selected independently of outcomes. Q01/Q23 are calibration questions.
# Beta=0 pins the persona projection; it does not disable steering.
# Retain all fitted-layer readouts/activations; initial CPU analysis uses only layers 32, 35, 62.
name: question-bank-reduced-band
description: 'Reduced exploratory character-band experiment: first question per topic
  (12 total), all 16 personas, beta 0 and 0.25, and layers 29/32/35 separately or
  together. Q01 and Q23 are pilot calibration questions. Planned analysis readout
  layers: 32, 35, 62.'
