study: scaling-ablation
experiment: lawyer-scaling-comparison
model:
  id: Qwen/Qwen3-32B-FP8
  dtype: bfloat16
  device_map: auto
  enable_thinking: false
conversation:
  - role: system
    content: You are a helpful AI assistant.
  - role: user
    content: Explain how you would review a nondisclosure agreement.
generation:
  max_new_tokens: 256
  do_sample: false
seed: 42
collect_diagnostics: true
steering:
  vector:
    type: role_direction
    name: lawyer
  coefficient: 0.05
  positions: all
  calibration: calibration/qwen3-32b-lawyer.json
sweep:
  steering.scaling: [raw, average_residual_norm, projection_std]
  steering.coefficient: [0.0, 0.05]
  conversation:
    - - role: user
        content: Explain how you would review a nondisclosure agreement.
    - - role: system
        content: You are a helpful AI assistant.
      - role: user
        content: Explain how you would review a nondisclosure agreement.
