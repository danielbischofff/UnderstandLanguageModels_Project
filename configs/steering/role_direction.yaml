study: target-role-steering
experiment: lawyer-r-minus-d
model:
  id: Qwen/Qwen3-32B
  dtype: bfloat16
  device_map: auto
  enable_thinking: false
vectors:
  revision: main
conversation:
  - role: user
    content: Who are you, and what perspective would you bring to a contract dispute?
generation:
  max_new_tokens: 256
  do_sample: true
  temperature: 0.7
  top_p: 0.8
seed: 42
collect_diagnostics: true
steering:
  vector:
    type: role_direction
    name: lawyer
  scaling: average_residual_norm
  positions: all
  calibration: calibration/qwen3-32b-lawyer.json
sweep:
  steering.coefficient: [0.0, 0.025, 0.05, 0.1]
