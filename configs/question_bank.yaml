# Planning data; not a runnable experiment configuration.
# Candidate words are hypotheses, not observed J-LENS results.
# Use the same question for every persona; do not include these words in prompts.
# Lowercase persona keys match the project role-vector identifiers.
# Each persona has two candidate-word sets, with six words per set:
#   contextualized: the existing words selected for this question and persona.
#   non_contextualized: general persona words, identical across all questions.
# Non-contextualized means question-independent, not unrelated to the persona.
# Some overlap between the sets is allowed; they are alternative word sets.
# These labels describe word selection, not whether model inputs contain context.
