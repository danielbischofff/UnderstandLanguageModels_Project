questions:
- id: Q01
  text: A town wants to change its annual festival to attract new visitors. What should
    it consider?
- id: Q02
  text: A community's traditional language is being spoken less often. Why might preserving
    it matter?
- id: Q03
  text: How might living beside a large river shape a town's daily life?
- id: Q04
  text: Two maps show the same region in very different ways. How should I decide
    which one to use?
- id: Q05
  text: My schedule is crowded and I keep putting off rest. How should I think about
    making time for it?
- id: Q06
  text: A community center can introduce one new wellbeing program. How should it
    choose what to offer?
- id: Q07
  text: I found a letter written a century ago. How could I understand what it tells
    us about that time?
- id: Q08
  text: How did the arrival of a factory potentially change life in a small town?
- id: Q09
  text: I want to try a new hobby but do not know where to start. How should I choose?
- id: Q10
  text: Our neighborhood wants to organize a shared meal. What would make it work
    well?
- id: Q11
  text: The average score rose, but several students did worse. How can both things
    be true?
- id: Q12
  text: The first few numbers in a sequence seem to follow a pattern. How can I tell
    whether it continues?
- id: Q13
  text: A pond looks different in summer than in winter. What might explain the changes?
- id: Q14
  text: Two seeds from the same packet grow at different speeds. What could account
    for that?
- id: Q15
  text: Someone new has joined our group and rarely speaks. How could we help them
    feel welcome?
- id: Q16
  text: Two friends faced similar situations but made very different choices. How
    can I understand their decisions?
- id: Q17
  text: What does it mean to live a good life?
- id: Q18
  text: If someone means well but causes a bad outcome, how should we judge their
    action?
- id: Q19
  text: Why might a repeated ritual be meaningful to the people who practice it?
- id: Q20
  text: How can people with different religious beliefs share a public space respectfully?
- id: Q21
  text: A neighborhood disagrees about how to use a shared budget. How should it reach
    a decision?
- id: Q22
  text: Some residents find it much harder than others to reach work or school. What
    should a town consider?
- id: Q23
  text: A team wants to use an automated tool for a task it currently does manually.
    What should it evaluate?
- id: Q24
  text: An image generated by a computer looks like a real photograph. How should
    people interpret it?
