# Planning data; not a runnable experiment configuration.
# Same topics, IDs, titles and questions as question_bank.yaml.
# Candidate words are authored hypotheses, not paper vocabulary or observed results.
# Role source: https://github.com/safety-research/assistant-axis/blob/master/data/roles/role_list.json
# Paper: https://arxiv.org/abs/2601.10387
# Vectors: https://huggingface.co/datasets/lu-christina/assistant-axis-vectors
# Role names also checked against the local atlas.json inventory.
#
# Contrast pairs (our experimental interpretation, not paper-defined moral axes):
# altruist / narcissist: others' welfare versus personal admiration.
# mediator / provocateur: conflict resolution versus deliberate provocation.
# guardian / predator: shielding the vulnerable versus hunting prey.
# builder / saboteur: durable construction versus covert damage.
#
# No role names overlap with the first bank. These pairs target distinct behaviors,
# but semantic independence or orthogonality of the vectors is not established.
# Roles are archetypes, not moral judgments about people or clinical diagnoses.
# Provocation need not be harmful; predation is an ecological role in nature.
# Protective, constructive, or harmful behavior must be assessed in context.
# Words for neutral questions may reflect metaphor or style rather than behavior.
# Keep these words out of prompts; use the same question for every role.
# Compare with an unsteered run as a separate experimental control.
# Each persona has two candidate-word sets, with six words per set:
#   contextualized: the existing words selected for this question and persona.
#   non_contextualized: general persona words, identical across all questions.
# Non-contextualized means question-independent, not unrelated to the persona.
# Some overlap between the sets is allowed; they are alternative word sets.
# These labels describe word selection, not whether model inputs contain context.
